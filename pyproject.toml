[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "pybaycor"
dynamic = ["version"]
description = "Bayesian inference of (robust) correlation coefficients for uncertain and censored data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Scicluna" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "xarray>=2024.10",
  "pymc>=6.1",
  "arviz>=1.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30", "numpyro>=0.15"]
nutpie = ["nutpie>=0.16.10"]
blackjax = ["blackjax>=1.2"]
extras = ["pymc-extras>=0.2"]
all = [
  "jax>=0.4.30",
  "numpyro>=0.15",
  "nutpie>=0.16.10",
  "blackjax>=1.2",
  "pymc-extras>=0.2",
]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "pre-commit", "mypy"]
docs = ["sphinx>=7", "myst-parser", "sphinx-autoapi", "furo", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/pscicluna/pybaycor"
Documentation = "https://pybaycor.readthedocs.io/"
"Bug Tracker" = "https://github.com/pscicluna/pybaycor/issues"

# ---------------------------------------------------------------------------
# hatch
# ---------------------------------------------------------------------------
# The version is derived from git tags (hatch-vcs / setuptools-scm): a tagged commit
# such as v0.3.0 gives 0.3.0, later commits give 0.3.1.devN+g<hash>. The build writes
# the resolved version to pybaycor/_version.py, which is not committed.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pybaycor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pybaycor"]

[tool.hatch.build.targets.sdist]
include = ["pybaycor", "tests", "README.md", "LICENSE", "CITATION.cff"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pybaycor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF", "D"]
ignore = ["D105", "D107", "D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest / mypy / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# The package is collected too, so that the docstring examples run as doctests; the
# deprecated pybaycor.pybaycor shim is skipped because importing it warns.
testpaths = ["tests", "pybaycor"]
addopts = "-ra --strict-markers --doctest-modules --ignore=pybaycor/pybaycor.py"
markers = [
  "slow: slow integration tests that run MCMC",
  "jax: requires jax/numpyro",
  "nutpie: requires nutpie",
]
# Silence DeprecationWarnings raised by third-party libraries; our own code
# (pybaycor.*) is deliberately not listed so its deprecations stay visible.
filterwarnings = [
  "ignore::DeprecationWarning:pytensor.*",
  "ignore::DeprecationWarning:pymc.*",
  "ignore::DeprecationWarning:arviz.*",
  "ignore::DeprecationWarning:xarray.*",
  "ignore::DeprecationWarning:pandas.*",
  "ignore::DeprecationWarning:jax.*",
  "ignore::DeprecationWarning:numpyro.*",
  "ignore::DeprecationWarning:nutpie.*",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["pybaycor"]

[tool.coverage.run]
source = ["pybaycor"]

# ---------------------------------------------------------------------------
# pixi (>= 0.82)
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
pymc = ">=6.1"
arviz = ">=1.1"
numpy = ">=1.26"
scipy = ">=1.11"
pandas = ">=2.0"
xarray = ">=2024.10"
matplotlib-base = ">=3.8"

[tool.pixi.pypi-dependencies]
pybaycor = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
pytest-cov = "*"
ruff = ">=0.6"
pre-commit = "*"
mypy = "*"

# jaxlib has no conda-forge build for win-64, so the jax feature resolves from PyPI.
[tool.pixi.feature.jax.pypi-dependencies]
jax = ">=0.4.30"
numpyro = ">=0.15"

[tool.pixi.feature.nutpie.dependencies]
nutpie = ">=0.16.10"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=7"
myst-parser = "*"
sphinx-autoapi = "*"
furo = "*"
sphinx-copybutton = "*"

[tool.pixi.feature.examples.dependencies]
jupyterlab = "*"
ipykernel = "*"
nbconvert = "*"

[tool.pixi.feature.examples.tasks]
examples = "jupyter lab examples"
run-examples = "jupyter nbconvert --to notebook --execute --inplace examples/*.ipynb"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
jax = { features = ["jax", "dev"] }
full = { features = ["jax", "nutpie", "dev"] }
docs = { features = ["docs"] }
examples = { features = ["examples", "nutpie"] }
py312 = { features = ["py312", "dev"] }
py313 = { features = ["py313", "dev"] }

[tool.pixi.tasks]
test = "pytest -m 'not slow'"
test-all = "pytest"
test-cov = "pytest -m 'not slow' --cov=pybaycor --cov-report=term-missing"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy"
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
precommit = "pre-commit run --all-files"
sync-citation = "python scripts/sync_citation.py"
check-citation = "python scripts/sync_citation.py --check"
