# Read the Docs configuration: https://docs.readthedocs.com/platform/en/stable/config-file/v2.html
#
# The documentation is built in the locked `docs` pixi environment, the same one CI
# uses, instead of a separate requirements file that could drift from pixi.lock.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"  # required by Read the Docs; pixi provides the build's own Python
  jobs:
    post_checkout:
      # The package version comes from the git tags (hatch-vcs), and Read the Docs
      # makes a shallow clone without them.
      - git fetch --unshallow || true
      - git fetch --tags || true
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      - pixi install -e docs --locked
    build:
      html:
        # Warnings are errors, as in the CI docs job (`pixi run -e docs docs`).
        - pixi run -e docs sphinx-build -T -W --keep-going -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
