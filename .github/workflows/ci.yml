name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev
          cache: true
      - run: pixi run -e dev lint
      - run: pixi run -e dev fmt-check
      - run: pixi run -e dev check-citation

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: [py312, py313]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}
          cache: true
      - run: pixi run -e ${{ matrix.environment }} test-cov

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: docs
          cache: true
      # Warnings are errors. Read the Docs publishes the site (.readthedocs.yaml);
      # this job keeps a broken docs build from merging.
      - run: pixi run -e docs docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
