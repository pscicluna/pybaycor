name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish so the docs deployment completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev
          cache: true
      - run: pixi run -e dev lint
      - run: pixi run -e dev fmt-check
      - run: pixi run -e dev check-citation

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: [py312, py313]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}
          cache: true
      - run: pixi run -e ${{ matrix.environment }} test-cov

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the version can be derived from tags
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: docs
          cache: true
      - run: pixi run -e docs docs  # warnings are errors
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-docs:
    name: Deploy docs
    # Publish to GitHub Pages only from the default branch; PRs just build the docs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment half-way; a newer push queues behind it instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
